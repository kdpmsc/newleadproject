<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Lead Agent Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef4fb; margin: 0; padding: 30px; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { color: #103a69; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 20px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
    .card h3 { margin: 0 0 10px; color: #567; }
    .card .value { font-size: 32px; font-weight: bold; color: #123a67; }
    table { width: 100%; border-collapse: collapse; margin-top: 24px; background: #fff; }
    th, td { border-bottom: 1px solid #e5edf8; padding: 12px; text-align: left; }
    th { background: #f3f8ff; }
    button { background: #0c6cf2; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Lead Agent Dashboard</h1>
    <button id="loadBtn">Load dashboard</button>
    <div class="stats" id="stats"></div>
    <table>
      <thead>
        <tr>
          <th>Lead</th>
          <th>Phone</th>
          <th>Status</th>
          <th>Score</th>
          <th>Summary</th>
        </tr>
      </thead>
      <tbody id="leadTable"></tbody>
    </table>
  </div>

  <script>
    const apiBase = `${window.LEAD_API_BASE_URL || window.location.origin}/api/v1`;
    const auth = 'Basic ' + btoa('admin:admin123');

    document.getElementById('loadBtn').addEventListener('click', async () => {
      const dashboard = await fetch(`${apiBase}/dashboard`, { headers: { Authorization: auth } }).then(r => r.json());
      const leads = await fetch(`${apiBase}/leads`, { headers: { Authorization: auth } }).then(r => r.json());

      const stats = document.getElementById('stats');
      stats.innerHTML = `
        <div class="card"><h3>Queued</h3><div class="value">${dashboard.queued}</div></div>
        <div class="card"><h3>Called Today</h3><div class="value">${dashboard.calledToday}</div></div>
        <div class="card"><h3>Qualified</h3><div class="value">${dashboard.qualified}</div></div>
        <div class="card"><h3>Hot Leads</h3><div class="value">${dashboard.hotLeads}</div></div>
      `;

      const table = document.getElementById('leadTable');
      table.innerHTML = leads.map(lead => `
        <tr>
          <td>${lead.name}</td>
          <td>${lead.phone}</td>
          <td>${lead.status}</td>
          <td>${lead.scoreBand || 'COLD'}</td>
          <td>${lead.summary || 'Awaiting call'}</td>
        </tr>
      `).join('');
    });
  </script>
</body>
</html>
