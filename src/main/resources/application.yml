# LeadProject runtime configuration.
# Prefer environment variables / .env (via Docker Compose) for secrets and per-environment URLs.
# Defaults live here; Java @ConfigurationProperties fields have no magic-string defaults.

app:
  # Public base URL for Twilio/Plivo webhooks (ngrok HTTPS URL or server URL).
  public-base-url: ${APP_PUBLIC_BASE_URL:${TWILIO_APP_BASE_URL:http://localhost:8080}}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5500}

  cors:
    allowed-origins:
      - http://localhost:8080
      - http://localhost:5500
      - http://127.0.0.1:5500
    # Extra origins from env (comma-separated), merged at runtime
    extra-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
      - "https://*.ngrok-free.dev"
      - "https://*.ngrok-free.app"
      - "https://*.ngrok.app"
      - "https://*.ngrok.io"
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - ngrok-skip-browser-warning
    allow-credentials: true

  ai:
    # ollama | openai | openrouter | anthropic
    provider: ${AI_PROVIDER:ollama}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:45000}
    temperature: ${AI_TEMPERATURE:${OLLAMA_TEMPERATURE:0.3}}
    max-tokens: ${AI_MAX_TOKENS:${OLLAMA_NUM_PREDICT:40}}
    max-conversation-chars: ${AI_MAX_CONVERSATION_CHARS:1200}
    fallback-lead-name: ${AI_FALLBACK_LEAD_NAME:there}
    empty-conversation-placeholder: ${AI_EMPTY_CONVERSATION_PLACEHOLDER:(no messages yet)}
    new-conversation-placeholder: ${AI_NEW_CONVERSATION_PLACEHOLDER:(new conversation)}
    system-prompt: |
      You are a brief UAE real-estate phone qualifier for XYZ Properties.
      Ask one short question at a time. Collect intent, property type, location,
      budget, timeline, decision-maker status, and callback time.
      Acknowledge briefly, then ask the next useful question.
      Respect stop, opt-out, or human-transfer requests.
      Never invent availability, prices, legal advice, or guarantees.
      Reply with spoken words only: no markup, labels, or emojis.
      Keep replies under 40 words.
    chat-system-prompt: ${AI_CHAT_SYSTEM_PROMPT:You are a helpful AI assistant for development testing.}
    voice-user-prompt-template: |
      Lead: {name}
      Transcript:
      {history}

      Speak the next short reply only.
    chat-user-prompt-template: |
      Conversation so far:
      {conversation}

      User message:
      {message}

      Reply naturally and helpfully. Keep the response concise.
    qualification-system-prompt: |
      You are a compliant UAE lead qualification assistant.
      Use only approved playbook questions and extract structured facts.
      Return JSON only.
    qualification-user-prompt-template: |
      Playbook: {playbook}
      Transcript:
      {transcript}

      Return JSON with:
      - disposition (qualified|nurture|unqualified|opt_out|callback_requested|unknown)
      - summary
      - recommended_next_action
      - risk_flags
      - fields with intent, budget, timeline, location_or_jurisdiction, decision_maker, preferred_callback_time
    warmup-system-prompt: ${AI_WARMUP_SYSTEM_PROMPT:Reply with OK only.}
    warmup-user-prompt: ${AI_WARMUP_USER_PROMPT:OK}

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3.2:3b}
      chat-path: ${OLLAMA_CHAT_PATH:/api/chat}
      num-predict: ${OLLAMA_NUM_PREDICT:40}
      num-ctx: ${OLLAMA_NUM_CTX:1024}
      keep-alive: ${OLLAMA_KEEP_ALIVE:30m}

    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      chat-path: ${OPENAI_CHAT_PATH:/v1/chat/completions}

    openrouter:
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api}
      api-key: ${OPENROUTER_API_KEY:}
      model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
      http-referer: ${OPENROUTER_HTTP_REFERER:}
      app-title: ${OPENROUTER_APP_TITLE:leadproject}
      chat-path: ${OPENROUTER_CHAT_PATH:/v1/chat/completions}

    anthropic:
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}
      version: ${ANTHROPIC_VERSION:2023-06-01}
      messages-path: ${ANTHROPIC_MESSAGES_PATH:/v1/messages}

  voice:
    company-name: ${VOICE_COMPANY_NAME:XYZ Properties}
    fallback-company-name: ${VOICE_FALLBACK_COMPANY_NAME:XYZ Properties}
    fallback-lead-name: ${VOICE_FALLBACK_LEAD_NAME:there}
    greeting-template: ${VOICE_GREETING_TEMPLATE:Hello {name}, I am calling from {company} regarding your Dubai property inquiry. How can I help you today - are you looking to buy, rent, sell, or invest?}
    iv-greeting-template: ${VOICE_IV_GREETING_TEMPLATE:Hello {name}, I am calling from {company} regarding your Dubai property inquiry.}
    iv-questions:
      - ${VOICE_IV_Q1:Are you looking to buy, rent, sell, or invest?}
      - ${VOICE_IV_Q2:Which area and property type are you considering?}
      - ${VOICE_IV_Q3:What budget range are you comfortable with?}
      - ${VOICE_IV_Q4:When do you plan to purchase?}
      - ${VOICE_IV_Q5:Are you the decision maker?}
      - ${VOICE_IV_Q6:When should a property consultant contact you?}
    no-answer-phrase: ${VOICE_NO_ANSWER_PHRASE:We did not receive an answer. Goodbye.}
    unavailable-phrase: ${VOICE_UNAVAILABLE_PHRASE:Our voice assistant is temporarily unavailable. Please try again later. Goodbye.}
    opt-out-phrase: ${VOICE_OPT_OUT_PHRASE:Understood. We will not contact you again. Goodbye.}
    closing-phrase: ${VOICE_CLOSING_PHRASE:Thank you. Our property consultant will contact you shortly. Goodbye.}
    opt-out-keywords:
      - stop
      - do not call
      - don't call
      - opt out
    script-intro: "${VOICE_SCRIPT_INTRO:Hello, this is a property qualification call. We are calling regarding your interest in Dubai property. May I ask a few quick questions to understand your requirement?}"
    summary-template: "${VOICE_SUMMARY_TEMPLATE:Lead: %s. Interested in %s property. Budget: %s. Preferred area: %s. Timeline: %s. Decision maker: %s. Preferred callback: %s.}"
    next-action: "${VOICE_NEXT_ACTION:Create an outbound property consultation callback for the salesperson after the qualification call.}"
    think-budget-ms: ${VOICE_THINK_BUDGET_MS:40000}
    max-think-polls: ${VOICE_MAX_THINK_POLLS:10}
    think-pause-seconds: ${VOICE_THINK_PAUSE_SECONDS:2}
    speech-language: ${VOICE_SPEECH_LANGUAGE:en-US}

# In-memory Basic Auth users. Passwords MUST come from env / .env (never commit real secrets).
security:
  users:
    - username: ${APP_ADMIN_USERNAME:admin}
      password: ${APP_ADMIN_PASSWORD:}
      roles:
        - ADMIN
    - username: ${APP_SALES_USERNAME:sales}
      password: ${APP_SALES_PASSWORD:}
      roles:
        - SALES
    - username: ${APP_COMPLIANCE_USERNAME:compliance}
      password: ${APP_COMPLIANCE_PASSWORD:}
      roles:
        - COMPLIANCE

# Keep Spring AI Ollama auto-config aligned when provider=ollama (ChatClient unused by voice path).
spring:
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2:3b}
          temperature: ${OLLAMA_TEMPERATURE:0.3}
          num-predict: ${OLLAMA_NUM_PREDICT:40}
          num-ctx: ${OLLAMA_NUM_CTX:1024}

voice:
  provider: ${VOICE_PROVIDER:twilio}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}
  app-base-url: ${TWILIO_APP_BASE_URL:${APP_PUBLIC_BASE_URL:http://localhost:8080}}
  record-call: ${TWILIO_RECORD_CALL:false}

plivo:
  auth-id: ${PLIVO_AUTH_ID:}
  auth-token: ${PLIVO_AUTH_TOKEN:}
  phone-number: ${PLIVO_PHONE_NUMBER:}
  app-base-url: ${PLIVO_APP_BASE_URL:${APP_PUBLIC_BASE_URL:http://localhost:8080}}
  api-base-url: ${PLIVO_API_BASE_URL:https://api.plivo.com}
  call-path-template: ${PLIVO_CALL_PATH_TEMPLATE:/v1/Account/{authId}/Call/}
  ring-timeout-seconds: ${PLIVO_RING_TIMEOUT_SECONDS:45}