services:
  ollama:
    build:
      context: .
      dockerfile: ollama.Dockerfile
    container_name: leadproject-ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$${OLLAMA_MODEL:-llama3.2:3b}\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10s

  postgres:
    image: postgres:16
    container_name: leadproject-db
    environment:
      POSTGRES_DB: leadproject
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: leadproject-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@leadproject.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leadproject-app
    depends_on:
      postgres:
        condition: service_started
      ollama:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/leadproject
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_DRIVER: org.postgresql.Driver
      HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      JPA_HIBERNATE_DDL_AUTO: update
      APP_ADMIN_USERNAME: admin
      APP_ADMIN_PASSWORD: admin123
      SPRING_AI_OLLAMA_BASE_URL: http://127.0.0.1:11434
      SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-twilio}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      TWILIO_APP_BASE_URL: ${TWILIO_APP_BASE_URL:-https://gaining-contort-judgingly.ngrok-free.dev}
      TWILIO_RECORD_CALL: ${TWILIO_RECORD_CALL:-false}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  ollama_data:
